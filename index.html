<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SDIRBINGAKKUM - PWA Prototype</title>
    <script src="https://www.gstatic.com/antigravity/web/dev/tailwindcss.min.js"></script>
    <style>
        /* Custom Styles & Glassmorphism */
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        
        body {
            font-family: 'Inter', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        .glass-panel {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.1);
        }

        .glass-input {
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: white;
            transition: all 0.3s ease;
        }
        .glass-input:focus {
            outline: none;
            border-color: rgba(251, 191, 36, 0.5); /* Amber accent */
            background: rgba(0, 0, 0, 0.4);
        }

        .btn-primary {
            background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
            color: #fff;
            box-shadow: 0 4px 15px rgba(245, 158, 11, 0.3);
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .btn-primary:active {
            transform: translateY(2px);
            box-shadow: 0 2px 8px rgba(245, 158, 11, 0.3);
        }

        .fade-enter {
            animation: fade-in 0.4s cubic-bezier(0.4, 0, 0.2, 1) forwards;
        }

        @keyframes fade-in {
            0% { opacity: 0; transform: translateY(10px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        /* Hide scrollbar for clean app feel */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        
        .nav-item.active {
            color: #fbd38d; /* Amber 200 */
        }
    </style>
</head>
<body class="bg-gradient-to-br from-[#0a1f0e] via-[#1a2a10] to-[#1c1208] h-[100dvh] text-slate-100 flex justify-center selection:bg-amber-500/30 overflow-hidden">

    <!-- Mobile App Container -->
    <div id="app-container" class="w-full max-w-md bg-black/20 shadow-2xl relative flex flex-col h-[100dvh] overflow-hidden">
        
        <!-- ================= LOGIN SCREEN ================= -->
        <div id="screen-login" class="flex-1 flex flex-col items-center justify-center p-8 relative z-10 fade-enter">
            <!-- Decorative background elements -->
            <div class="absolute top-10 left-10 w-32 h-32 bg-amber-500/20 rounded-[0.4rem] blur-3xl pointer-events-none"></div>
            <div class="absolute bottom-10 right-10 w-40 h-40 bg-emerald-500/20 rounded-[0.4rem] blur-3xl pointer-events-none"></div>

            <!-- Logo POMAD -->
            <img src="logo.png" alt="Logo POMAD" class="w-36 h-36 object-contain mb-6 drop-shadow-[0_0_20px_rgba(245,158,11,0.25)]">

            <h1 class="text-3xl font-bold tracking-wider mb-2 text-center text-transparent bg-clip-text bg-gradient-to-r from-amber-200 to-amber-500">
                SDIRBINGAKKUM
            </h1>
            <p class="text-emerald-200/60 text-sm mb-10 tracking-widest uppercase">PUSPOMAD</p>

            <form id="login-form" class="w-full max-w-sm space-y-5" onsubmit="event.preventDefault(); login();">
                <div class="space-y-1">
                    <label class="text-xs font-semibold text-emerald-200/80 uppercase tracking-wider ml-1">Username</label>
                    <input type="text" required class="w-full px-4 py-3 rounded-[0.4rem] glass-input backdrop-blur-sm focus:ring-2 focus:ring-amber-500/50" placeholder="Masukkan username">
                </div>
                <div class="space-y-1">
                    <label class="text-xs font-semibold text-emerald-200/80 uppercase tracking-wider ml-1">Password</label>
                    <input type="password" required class="w-full px-4 py-3 rounded-[0.4rem] glass-input backdrop-blur-sm focus:ring-2 focus:ring-amber-500/50" placeholder="Password">
                </div>
                
                <div class="pt-4">
                    <button type="submit" class="w-full py-3.5 rounded-[0.4rem] btn-primary font-semibold tracking-wide flex items-center justify-center gap-2">
                        <span>MASUK</span>
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"></path></svg>
                    </button>
                </div>
            </form>
        </div>

        <!-- ================= MAIN APP DASHBOARD ================= -->
        <div id="screen-dashboard" class="hidden flex-col h-full fade-enter">
            
            <!-- Header -->
            <!-- Header -->
            <header class="px-5 pt-6 pb-3 glass-panel rounded-b-[0.8rem] border-t-0 border-x-0 z-20 shrink-0">
                <div class="flex justify-between items-center">
                    <div>
                        <p class="text-[10px] text-amber-400 font-medium tracking-wider mb-0.5">DASHBOARD</p>
                        <h2 id="header-title" class="text-lg font-bold text-white tracking-wide">Pelanggaran</h2>
                    </div>
                    <button class="w-8 h-8 rounded-[0.4rem] bg-white/10 flex items-center justify-center border border-white/10" onclick="logout()">
                        <svg class="w-4 h-4 text-emerald-100" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path></svg>
                    </button>
                </div>
            </header>

            <!-- Scrollable Content Area -->
            <main id="main-content" class="flex-1 overflow-y-auto no-scrollbar p-5 pb-6 space-y-4 relative z-10">
                <!-- Content injected via JS -->
            </main>

            <!-- Bottom Navigation -->
            <nav class="glass-panel border-b-0 border-x-0 rounded-t-[0.8rem] z-30 shrink-0 mt-auto overflow-hidden">
                <div class="flex items-center pt-1 pb-1">
                    
                    <button onclick="switchTab('pelanggaran')" class="nav-item active flex-1 flex flex-col items-center justify-center gap-1.5 pt-3 pb-2 text-emerald-200/50 hover:text-emerald-100 transition-colors relative">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path></svg>
                        <span class="text-[10px] font-medium tracking-wide">Tatib</span>
                    </button>

                    <button onclick="switchTab('sim')" class="nav-item flex-1 flex flex-col items-center justify-center gap-1.5 pt-3 pb-2 text-emerald-200/50 hover:text-emerald-100 transition-colors relative">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M10 6H5a2 2 0 00-2 2v9a2 2 0 002 2h14a2 2 0 002-2V8a2 2 0 00-2-2h-5m-4 0V5a2 2 0 114 0v1m-4 0a2 2 0 104 0m-5 8a2 2 0 100-4 2 2 0 000 4zm0 0c1.306 0 2.417.835 2.83 2M9 14a3.001 3.001 0 00-2.83 2M15 11h3m-3 4h2"></path></svg>
                        <span class="text-[10px] font-medium tracking-wide">SIM</span>
                    </button>

                    <button onclick="switchTab('provos')" class="nav-item flex-1 flex flex-col items-center justify-center gap-1.5 pt-3 pb-2 text-emerald-200/50 hover:text-emerald-100 transition-colors relative">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"></path></svg>
                        <span class="text-[10px] font-medium tracking-wide">Provos</span>
                    </button>

                    <button onclick="switchTab('laka')" class="nav-item flex-1 flex flex-col items-center justify-center gap-1.5 pt-3 pb-2 text-emerald-200/50 hover:text-emerald-100 transition-colors relative">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                        <span class="text-[10px] font-medium tracking-wide">Laka</span>
                    </button>
                </div>
            </nav>
        </div>
        <!-- ================= STATISTIK MODAL ================= -->
        <div id="modal-statistik" class="fixed inset-0 z-50 flex-col justify-end hidden opacity-0 transition-opacity duration-300">
            <!-- Backdrop -->
            <div class="absolute inset-0 bg-slate-950/80 backdrop-blur-sm transition-opacity" onclick="closeStatistik()"></div>
            <!-- Bottom Sheet -->
            <div id="sheet-statistik" class="relative w-full bg-gradient-to-t from-slate-900 to-emerald-950 border-t border-emerald-500/20 rounded-t-[1.5rem] p-6 pt-3 shadow-[0_-10px_40px_rgba(0,0,0,0.5)] transform translate-y-full transition-transform duration-500 ease-out h-[70vh] flex flex-col">
                <div class="w-12 h-1.5 bg-white/20 rounded-[0.4rem] mx-auto mb-5"></div>
                <div class="flex justify-between items-center mb-6">
                    <div>
                        <h3 class="text-xl font-bold text-amber-400 tracking-wide">Analisis Visual</h3>
                        <p class="text-[11px] text-emerald-200/70 uppercase tracking-widest mt-1" id="modal-subtitle">Top 5 POMDAM</p>
                    </div>
                    <button onclick="closeStatistik()" class="w-8 h-8 rounded-[0.4rem] bg-white/5 flex items-center justify-center border border-white/10 text-emerald-100 hover:bg-white/10">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                    </button>
                </div>
                
                <!-- Chart Container (Scrollable) -->
                <div class="flex-1 overflow-y-auto no-scrollbar space-y-5" id="chart-container">
                    <!-- Bars injected by JS -->
                </div>
            </div>
        </div>

    </div>

    <script>
        // State Management
        const state = {
            pelanggaran: {
                tahun: [
                    { label: 'TATIB', value: '25', color: 'amber' },
                    { label: 'LALIN', value: '70', color: 'sky' }
                ],
                bulan: [
                    { label: 'TATIB', value: '5', color: 'amber' },
                    { label: 'LALIN', value: '10', color: 'sky' }
                ]
            },
            sim: {
                tahun: [
                    { label: 'A', value: '200', color: 'blue' },
                    { label: 'BI', value: '100', color: 'cyan' },
                    { label: 'BII', value: '50', color: 'emerald' },
                    { label: 'BII SUS', value: '25', color: 'violet' },
                    { label: 'C', value: '25', color: 'indigo' }
                ],
                bulan: [
                    { label: 'A', value: '20', color: 'blue' },
                    { label: 'BI', value: '10', color: 'cyan' },
                    { label: 'BII', value: '5', color: 'emerald' },
                    { label: 'BII SUS', value: '5', color: 'violet' },
                    { label: 'C', value: '5', color: 'indigo' }
                ]
            },
            provos: {
                tahun: [
                    { label: 'JUMLAH', value: '2000', color: 'slate' },
                    { label: 'SUDAH DIK/TAR', value: '500', color: 'emerald' },
                    { label: 'BELUM DIK/TAR', value: '1500', color: 'amber' }
                ],
                bulan: [
                    { label: 'JUMLAH', value: '250', color: 'slate' },
                    { label: 'SUDAH DIK/TAR', value: '50', color: 'emerald' },
                    { label: 'BELUM DIK/TAR', value: '200', color: 'amber' }
                ]
            },
            laka: {
                tahun: [
                    { label: 'JUMLAH KASUS', value: '200', color: 'sky' },
                    { label: 'LAKA GANDA', value: '100', color: 'orange' },
                    { label: 'TUNGGAL', value: '50', color: 'amber' },
                    { label: 'TABRAK LARI', value: '50', color: 'red' }
                ],
                bulan: [
                    { label: 'JUMLAH KASUS', value: '30', color: 'sky' },
                    { label: 'LAKA GANDA', value: '20', color: 'orange' },
                    { label: 'TUNGGAL', value: '5', color: 'amber' },
                    { label: 'TABRAK LARI', value: '5', color: 'red' }
                ]
            }
        };

        const colorPalette = {
            amber:   { text: 'text-amber-400',   border: 'border-l-amber-500',   glow: 'bg-amber-500/20'  },
            sky:     { text: 'text-sky-400',      border: 'border-l-sky-500',     glow: 'bg-sky-500/20'    },
            red:     { text: 'text-red-400',      border: 'border-l-red-500',     glow: 'bg-red-500/20'    },
            blue:    { text: 'text-blue-400',     border: 'border-l-blue-500',    glow: 'bg-blue-500/20'   },
            cyan:    { text: 'text-cyan-400',     border: 'border-l-cyan-500',    glow: 'bg-cyan-500/20'   },
            emerald: { text: 'text-emerald-400',  border: 'border-l-emerald-500', glow: 'bg-emerald-500/20'},
            violet:  { text: 'text-violet-400',   border: 'border-l-violet-500',  glow: 'bg-violet-500/20' },
            indigo:  { text: 'text-indigo-400',   border: 'border-l-indigo-500',  glow: 'bg-indigo-500/20' },
            orange:  { text: 'text-orange-400',   border: 'border-l-orange-500',  glow: 'bg-orange-500/20' },
            slate:   { text: 'text-slate-200',    border: 'border-l-slate-400',   glow: 'bg-slate-500/20'  }
        };

        // Generic Render Function for 2 Columns
        function renderTwoColumns(dataObj) {
            let html = '<div class="space-y-4 fade-enter">';

            // 2-col grid
            html += '<div class="grid grid-cols-2 gap-4">';
            
            // Kolom Tahun
            html += '<div class="space-y-3">';
            html += '<h3 class="text-sm font-semibold text-amber-400 text-center mb-2 tracking-widest uppercase">2026</h3>';
            dataObj.tahun.forEach(item => {
                const c = colorPalette[item.color] || colorPalette.slate;
                html += `
                    <div class="glass-panel rounded-[0.4rem] p-4 flex flex-col items-start justify-center shadow-lg transition-transform hover:scale-105 min-h-[90px] relative overflow-hidden border-l-[3px] ${c.border}">
                        <div class="absolute -right-4 -bottom-4 w-16 h-16 ${c.glow} rounded-full blur-xl"></div>
                        <span class="text-[10px] font-semibold text-emerald-200/70 mb-1.5 uppercase tracking-wide leading-tight relative z-10">${item.label}</span>
                        <span class="text-3xl font-bold ${c.text} tracking-tight relative z-10">${item.value}</span>
                    </div>
                `;
            });
            html += '</div>';

            // Kolom Bulan
            html += '<div class="space-y-3">';
            html += '<h3 class="text-sm font-semibold text-amber-400 text-center mb-2 tracking-widest uppercase">SEPT</h3>';
            dataObj.bulan.forEach(item => {
                const c = colorPalette[item.color] || colorPalette.slate;
                html += `
                    <div class="glass-panel rounded-[0.4rem] p-4 flex flex-col items-start justify-center shadow-lg transition-transform hover:scale-105 min-h-[90px] relative overflow-hidden border-l-[3px] ${c.border}">
                        <div class="absolute -right-4 -bottom-4 w-16 h-16 ${c.glow} rounded-full blur-xl"></div>
                        <span class="text-[10px] font-semibold text-emerald-200/70 mb-1.5 uppercase tracking-wide leading-tight relative z-10">${item.label}</span>
                        <span class="text-3xl font-bold ${c.text} tracking-tight relative z-10">${item.value}</span>
                    </div>
                `;
            });
            html += '</div>';
            html += '</div>'; // end grid

            // Statistik Button
            html += `
                <button onclick="openStatistik()" class="w-full flex items-center justify-center gap-2.5 py-3 px-5 glass-panel rounded-[0.4rem] border border-amber-500/25 hover:border-amber-500/60 text-amber-400 hover:text-amber-300 transition-all duration-200 group">
                    <svg class="w-4 h-4 transition-transform group-hover:scale-110" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"/>
                    </svg>
                    <span class="text-xs font-semibold tracking-widest uppercase">Analisis Statistik</span>
                    <svg class="w-3.5 h-3.5 ml-auto opacity-50 transition-opacity group-hover:opacity-100" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/>
                    </svg>
                </button>
            `;

            html += '</div>'; // end space-y-4
            return html;
        }

        // Logic
        function login() {
            document.getElementById('screen-login').style.display = 'none';
            document.getElementById('screen-dashboard').style.display = 'flex';
            switchTab('pelanggaran');
        }

        function logout() {
            document.getElementById('screen-dashboard').style.display = 'none';
            document.getElementById('screen-login').style.display = 'flex';
            document.getElementById('login-form').reset();
        }

        let currentTab = 'pelanggaran';

        function switchTab(tabId) {
            currentTab = tabId;
            // Update active state in nav
            document.querySelectorAll('.nav-item').forEach(el => {
                if (el.getAttribute('onclick').includes(tabId)) {
                    el.classList.add('active');
                } else {
                    el.classList.remove('active');
                }
            });

            // Update content & Header
            const contentDiv = document.getElementById('main-content');
            const titleEl = document.getElementById('header-title');

            const titles = {
                'pelanggaran': 'Pelanggaran',
                'sim': 'Rekap SIM TNI',
                'provos': 'Provos TNI AD',
                'laka': 'Laka Lalin'
            };

            titleEl.textContent = titles[tabId];
            contentDiv.innerHTML = renderTwoColumns(state[tabId]);
        }

        // ================= MODAL & CHART LOGIC =================
        const chartData = {
            pelanggaran: [
                { label: 'POMDAM V/BRW', value: 130 },
                { label: 'POMDAM III/SLW', value: 85 },
                { label: 'POMDAM I/BB', value: 64 },
                { label: 'POMDAM JAYA', value: 42 },
                { label: 'POMDAM IV/DIP', value: 30 }
            ],
            sim: [
                { label: 'POMDAM JAYA', value: 450 },
                { label: 'POMDAM II/SWJ', value: 320 },
                { label: 'POMDAM V/BRW', value: 210 },
                { label: 'POMDAM I/BB', value: 190 },
                { label: 'POMDAM IM', value: 110 }
            ],
            provos: [
                { label: 'POMDAM III/SLW', value: 624 },
                { label: 'POMDAM V/BRW', value: 617 },
                { label: 'POMDAM I/BB', value: 535 },
                { label: 'POMDAM JAYA', value: 511 },
                { label: 'POMDAM IV/DIP', value: 463 }
            ],
            laka: [
                { label: 'POMDAM V/BRW', value: 45 },
                { label: 'POMDAM JAYA', value: 38 },
                { label: 'POMDAM I/BB', value: 30 },
                { label: 'POMDAM XII/TPR', value: 25 },
                { label: 'POMDAM III/SLW', value: 18 }
            ]
        };

        function openStatistik() {
            const modal = document.getElementById('modal-statistik');
            const sheet = document.getElementById('sheet-statistik');
            const container = document.getElementById('chart-container');
            const subtitle = document.getElementById('modal-subtitle');
            
            subtitle.textContent = `Top 5 POMDAM - ${currentTab.toUpperCase()}`;
            
            // Generate Chart HTML
            const data = chartData[currentTab];
            const maxVal = Math.max(...data.map(d => d.value));
            
            let html = '';
            data.forEach((item, idx) => {
                const perc = (item.value / maxVal) * 100;
                // Alternate bar colors
                const gradient = idx === 0 ? 'from-amber-400 to-amber-600' : 'from-emerald-400 to-emerald-600';
                
                html += `
                    <div class="relative">
                        <div class="flex justify-between items-end mb-1.5">
                            <span class="text-xs font-semibold text-white tracking-wide">${item.label}</span>
                            <span class="text-xs font-bold text-amber-400">${item.value}</span>
                        </div>
                        <div class="w-full bg-black/30 rounded-[0.4rem] h-3 overflow-hidden border border-white/5">
                            <div class="bg-gradient-to-r ${gradient} h-full rounded-[0.4rem] transition-all duration-1000 ease-out" style="width: 0%" data-width="${perc}%"></div>
                        </div>
                    </div>
                `;
            });
            container.innerHTML = html;

            // Show modal
            modal.classList.remove('hidden');
            modal.classList.add('flex');
            
            // Trigger animations
            requestAnimationFrame(() => {
                modal.classList.remove('opacity-0');
                sheet.classList.remove('translate-y-full');
                
                // Animate bars after a short delay
                setTimeout(() => {
                    const bars = container.querySelectorAll('[data-width]');
                    bars.forEach(bar => {
                        bar.style.width = bar.getAttribute('data-width');
                    });
                }, 300);
            });
        }

        function closeStatistik() {
            const modal = document.getElementById('modal-statistik');
            const sheet = document.getElementById('sheet-statistik');
            
            modal.classList.add('opacity-0');
            sheet.classList.add('translate-y-full');
            
            setTimeout(() => {
                modal.classList.add('hidden');
                modal.classList.remove('flex');
            }, 300);
        }
    </script>
</body>
</html>
